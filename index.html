<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - AWS DevOps</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <header class="border-b border-slate-800 pb-5 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-sky-400">👤 Sistema de Gestión de Usuarios</h1>
        <p class="text-slate-400 text-sm mt-1">AWS ECS Fargate ➔ API Gateway ➔ Lambda ➔ TablaUsuariosDev</p>
      </div>
      <span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium">
        ● Activo
      </span>
    </header>

    <!-- CONFIGURACIÓN API -->
    <section class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
        URL de tu API Gateway:
      </label>
      <input id="apiUrl" type="text" 
             value="https://uotohpo144.execute-api.us-east-1.amazonaws.com/users"
             class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-sky-300 focus:outline-none focus:border-sky-500">
    </section>

    <!-- CONTENIDO -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- FORMULARIO -->
      <div class="bg-slate-800/40 border border-slate-800 p-6 rounded-xl">
        <h2 class="text-lg font-semibold text-white mb-4">➕ Registrar Usuario</h2>
        <form id="userForm" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nombre Completo</label>
            <input type="text" id="nombre" required placeholder="Ej. Jhon Perez" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Correo Electrónico</label>
            <input type="email" id="email" required placeholder="ejemplo@correo.com" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
          <button type="submit" id="btnSubmit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition duration-200">
            Guardar en DynamoDB 🚀
          </button>
        </form>
      </div>

      <!-- LISTADO DE USUARIOS -->
      <div class="md:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-semibold text-white">📋 Usuarios en DynamoDB</h2>
          <button onclick="fetchUsers()" class="text-xs text-sky-400 hover:underline">🔄 Cargar / Actualizar</button>
        </div>
        
        <div id="usersList" class="space-y-3">
          <p class="text-slate-500 text-sm italic">Haz clic en "Cargar / Actualizar" para consultar la base de datos.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const userForm = document.getElementById('userForm');
    const apiUrlInput = document.getElementById('apiUrl');
    const usersList = document.getElementById('usersList');

    async function fetchUsers() {
      const url = apiUrlInput.value.trim();
      if (!url) return alert("00 Ingresa la URL de la API");
      
      usersList.innerHTML = `<p class="text-sky-400 text-sm">Consultando DynamoDB...</p>`;

      try {
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP Error status: ${res.status}`);
        
        const data = await res.json();
        renderUsers(data);
      } catch (err) {
        console.error(err);
        usersList.innerHTML = `
          <div class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-sm">
            <p class="font-bold">⚠️ Error de conexión (CORS / Red)</p>
            <p class="text-xs mt-1">No se pudo contactar a la API. Verifica que la URL finalice en <code>/users</code>.</p>
          </div>`;
      }
    }

    function renderUsers(items) {
      // Normalizar respuesta si viene dentro de un 'body' parseado
      const users = Array.isArray(items) ? items : (items.body ? JSON.parse(items.body) : []);

      if (!users || users.length === 0) {
        usersList.innerHTML = `<p class="text-slate-500 text-sm">No hay usuarios registrados en TablaUsuariosDev aún.</p>`;
        return;
      }

      usersList.innerHTML = users.map(u => `
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl flex justify-between items-center">
          <div>
            <h3 class="font-bold text-slate-100">${u.nombre || u.name || 'Sin nombre'}</h3>
            <p class="text-xs text-slate-400 mt-0.5">${u.email || 'Sin email'}</p>
          </div>
          <span class="text-xs font-mono text-slate-500 bg-slate-900 px-2 py-1 rounded">ID: ${u.id || 'N/A'}</span>
        </div>
      `).join('');
    }

    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = apiUrlInput.value.trim();
      const btn = document.getElementById('btnSubmit');

      const payload = {
        id: "usr-" + Date.now(),
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value
      };

      btn.disabled = true;
      btn.innerText = "Guardando...";

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("¡Usuario guardado exitosamente en DynamoDB!");
          document.getElementById('nombre').value = '';
          document.getElementById('email').value = '';
          fetchUsers();
        } else {
          alert("Error al guardar. Status: " + response.status);
        }
      } catch (err) {
        alert("Error de envío (CORS o Red): " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Guardar en DynamoDB 🚀";
      }
    });
  </script>
</body>
</html>
